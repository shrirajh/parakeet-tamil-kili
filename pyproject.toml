[project]
name = "kili"
version = "0.1.0"
description = "parakeet-tamil-kili: Tamil, English and code-switched speech recognition: inference, ONNX, Blackwell training kernels, metrics, LM and synthetic voices"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# NeMo inference, evaluation, LM decoding (GPU or CPU, PyTorch)
nemo = ["nemo_toolkit[asr]>=3.0", "torch>=2.6", "soundfile>=0.12", "scipy"]
# export the NeMo model to ONNX
export = ["kili[nemo]", "onnx>=1.17", "onnxruntime>=1.20"]
# CPU runtime, no PyTorch
onnx = ["onnxruntime>=1.20", "soundfile>=0.12", "scipy"]
# Home Assistant (Wyoming) speech-to-text server
wyoming = ["kili[onnx]", "wyoming>=1.5"]
# embedding error rate (EmbeddingGemma 2)
eer = ["torch>=2.6", "transformers>=4.56"]
# Tamil tokenizer extension + model surgery
tokenizer = ["kili[nemo]", "sentencepiece>=0.2"]
# n-gram LM corpus + KN 5-gram build
lm = ["sentencepiece>=0.2", "pyarrow", "huggingface_hub"]
# Blackwell training kernels + training utilities
train = ["kili[nemo]", "triton>=3.2", "lightning>=2.4", "lhotse>=1.30", "omegaconf>=2.3"]
# synthetic voices (Maya2 runtime `maya3`, pinned below to the commit the voices were made with)
synth = ["maya3", "torch>=2.6", "torchaudio", "soundfile>=0.12", "soxr", "jiwer"]

[tool.uv.sources]
maya3 = { git = "https://github.com/MayaResearch/maya2-native", rev = "c6b376868e268551d065c4206193e96257bef4a1" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kili"]

[tool.pytest.ini_options]
testpaths = ["tests"]
