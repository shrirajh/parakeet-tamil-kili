<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>social preview card source (renders img/og.png)</title>
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #0f0f0e; color: #f3f1ec; font-family: "Segoe UI", system-ui, sans-serif; position: relative; overflow: hidden; }
  .wrap { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; }
  .brand { font: 600 26px "Cascadia Mono", Consolas, monospace; color: #9b978f; letter-spacing: .02em; }
  h1 { margin: 26px 0 0; font-size: 76px; line-height: 1.02; letter-spacing: -.03em; font-weight: 800; }
  .ta { font-family: "Nirmala UI", "Latha", sans-serif; font-weight: 700; color: #3987e5; }
  .sub { margin-top: 18px; font-size: 30px; color: #c9c5bc; max-width: 900px; line-height: 1.3; }
  .stats { margin-top: auto; display: flex; gap: 22px; }
  .s { background: #1d1d1b; border: 1px solid #2c2c29; border-radius: 18px; padding: 18px 24px; min-width: 230px; }
  .s b { display: block; font: 800 44px "Cascadia Mono", Consolas, monospace; letter-spacing: -.03em; }
  .s span { display: block; margin-top: 6px; font-size: 19px; color: #9b978f; }
  .wave { position: absolute; left: 72px; right: 72px; top: 318px; display: flex; gap: 5px; align-items: center; height: 80px; }
  .wave i { display: block; flex: 1; border-radius: 3px; background: #3987e5; opacity: .55; }
</style></head>
<body>
  <div class="wave" id="wave"></div>
  <div class="wrap">
    <div class="brand">🦜 parakeet-tamil-kili</div>
    <h1>parakeet-tamil · <span class="ta">தமிழ் கிளி</span></h1>
    <div class="sub">Speech recognition for Tamil, English and both mixed, small enough to run on an ordinary CPU.</div>
    <div class="stats">
      <div class="s"><b>34.05</b><span>WER, conversational Tamil<br>indic-transcribe-core: 49.28</span></div>
      <div class="s"><b>28×</b><span>faster than real time<br>on 8 CPU threads</span></div>
      <div class="s"><b>0.6B</b><span>parameters · free<br>CC BY-SA 4.0</span></div>
    </div>
  </div>
  <script>
    const h = Array.from({ length: 96 }, (_, i) => 6 + Math.abs(Math.sin(i * 0.37) * Math.cos(i * 0.11) + 0.45 * Math.sin(i * 1.7)) * 52);
    document.getElementById("wave").innerHTML = h.map((v) => `<i style="height:${v}px"></i>`).join("");
  </script>
</body></html>
